<div class="body">
  <mat-card class="mat-elevation-z4">
    <div class="login">
      <form [formGroup]="myForm" (submit)="onSubmit()">
        <img src="../../assets/images/logo.png" width="60%" />

        @if (showServerStatus) {
        <div class="server-status" role="status" aria-live="polite">
          <span class="server-status-dot"
            [class.ready]="serverState === 'ready'"
            [class.unavailable]="serverState === 'unavailable'"
            aria-hidden="true"></span>
          <span>{{ serverMessage }}</span>
        </div>
        }

        <mat-form-field class="mt-4">
          <mat-label>Usuario</mat-label>
          <input
            type="email"
            formControlName="email"
            matInput
            placeholder="Nombre de usuario"
          />
        </mat-form-field>
        <mat-form-field>
          <mat-label>Contraseña</mat-label>
          <input
            type="text"
            type="password"
            formControlName="password"
            matInput
            placeholder="Contraseña"
          />
        </mat-form-field>

        <button
          mat-raised-button
          style="color: white"
          type="submit"
          class="button width-custom"
          color="accent"
          [disabled]="myForm.invalid || loading || serverState !== 'ready'"
        >
          Iniciar sesión
          <mat-icon class="mat-18">login</mat-icon>
        </button>

        @if (loading) {
          <div class="w-6 pl-8">
            <mat-progress-bar color="warn" style="width: 60%;" mode="indeterminate"></mat-progress-bar>
          </div>
        }
      </form>
    </div>
  </mat-card>
</div>
